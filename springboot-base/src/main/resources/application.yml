server:
  port: 8011
  servlet:
    context-path: /api
    # 请求/响应中文统一 UTF-8，避免前端显示为问号
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: pet-manager
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/pet_manager?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.jsonll.base.entity
  configuration:
    map-underscore-to-camel-case: true
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: pet-manager-jwt-secret-key-2024-32bytes-long-enough
  expire: 86400000
